name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      WINDOWS_CU_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build, portable checks and Windows x64 publish
        run: |
          New-Item -ItemType Directory -Force artifacts/acceptance | Out-Null
          & ./scripts/Build.ps1 -Runtime win-x64 *>&1 | Tee-Object artifacts/acceptance/windows-build.log

      - name: MCP stdio protocol
        run: |
          & dotnet run --project tests/WindowsComputerUse.Tests -c Release --no-build -- --protocol --server artifacts/win-x64/server/WindowsComputerUse.Server.exe --report-dir artifacts/acceptance *>&1 | Tee-Object artifacts/acceptance/windows-protocol.log
          if ($LASTEXITCODE -ne 0) { throw 'MCP protocol checks failed.' }

      - name: Native desktop and strict WGC smoke test
        run: |
          & ./scripts/Test-Windows.ps1 -Runtime win-x64 *>&1 | Tee-Object artifacts/acceptance/windows-desktop.log

      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-${{ github.sha }}
          path: artifacts/acceptance/
          retention-days: 14
          if-no-files-found: warn
