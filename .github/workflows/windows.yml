name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      WINDOWS_CU_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build, portable checks and Windows x64 publish
        id: build
        run: |
          New-Item -ItemType Directory -Force artifacts/acceptance | Out-Null
          & ./scripts/Build.ps1 -Runtime win-x64 *>&1 | Tee-Object artifacts/acceptance/windows-build.log

      - name: Test extracted self-contained bundle with Windows PowerShell 5.1
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'Windows CU 测试包'
          Expand-Archive artifacts/windows-cu-win-x64.zip $bundle
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$bundle/scripts/Test-Windows.ps1" -BundleRoot $bundle -ReportDirectory "$pwd/artifacts/acceptance" *>&1 | Tee-Object artifacts/windows-bundle-run.log
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained bundle tests failed. See acceptance reports.' }

      - name: Claude Code configuration and live MCP connection (no model call)
        if: ${{ !cancelled() && steps.build.outcome != 'failure' }}
        run: |
          & npm install -g @anthropic-ai/claude-code@latest
          if ($LASTEXITCODE -ne 0) { throw 'Claude Code CLI installation failed.' }
          $bundle = Join-Path $env:RUNNER_TEMP 'Windows CU 测试包'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'cu-claude-config'
          $version = (& claude --version | Out-String).Trim()
          $preservedPath = 'C:\保留路径\existing.exe'
          @{ mcpServers = @{ existing_fixture = @{ type = 'stdio'; command = $preservedPath; args = @() } } } | ConvertTo-Json -Depth 6 | Set-Content "$bundle/.mcp.json" -Encoding utf8
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$bundle/scripts/Register-ClaudeMcp.ps1" *>&1 | Tee-Object artifacts/acceptance/claude-project-config.log
          if ($LASTEXITCODE -ne 0) { throw 'Claude project setup failed.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$bundle/scripts/Register-ClaudeMcp.ps1" *>&1 | Tee-Object artifacts/acceptance/claude-project-repeat.log
          if ($LASTEXITCODE -ne 0) { throw 'Repeated Claude project setup failed.' }
          $config = Get-Content "$bundle/.mcp.json" -Raw -Encoding utf8 | ConvertFrom-Json
          if ($config.mcpServers.windows_cu.command -ne "$bundle\server\WindowsComputerUse.Server.exe") { throw 'Relocated MCP path mismatch.' }
          if ($config.mcpServers.existing_fixture.command -ne $preservedPath) { throw 'An existing Unicode MCP entry was changed.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'Windows CU 安装目录'
          $unrelatedSkill = Join-Path $env:CLAUDE_CONFIG_DIR 'skills/unrelated-fixture'
          New-Item -ItemType Directory -Force $unrelatedSkill | Out-Null
          'Preserve this existing personal skill.' | Set-Content "$unrelatedSkill/SKILL.md" -Encoding utf8
          $unrelatedHash = (Get-FileHash "$unrelatedSkill/SKILL.md").Hash
          $learnedSkill = Join-Path $env:CLAUDE_CONFIG_DIR 'skills/windows-client-preserved'
          New-Item -ItemType Directory -Force $learnedSkill | Out-Null
          'Previously learned client workflow must survive installation.' | Set-Content "$learnedSkill/SKILL.md" -Encoding utf8
          $learnedHash = (Get-FileHash "$learnedSkill/SKILL.md").Hash
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$bundle/scripts/Install-Claude.ps1" -BundleRoot $bundle -InstallRoot $installRoot *>&1 | Tee-Object artifacts/acceptance/claude-install.log
          if ($LASTEXITCODE -ne 0) { throw 'User installation failed.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$bundle/scripts/Install-Claude.ps1" -BundleRoot $bundle -InstallRoot $installRoot *>&1 | Tee-Object artifacts/acceptance/claude-reinstall.log
          if ($LASTEXITCODE -ne 0) { throw 'Repeated user installation failed.' }
          $receipt = Get-Content "$installRoot/installation.json" -Raw -Encoding utf8 | ConvertFrom-Json
          if ($receipt.mcpScope -ne 'user' -or -not $receipt.cliConnected) { throw 'User installation receipt is incomplete.' }
          if (-not (Test-Path $receipt.server) -or $receipt.server.StartsWith($bundle)) { throw 'MCP must use the permanent installed executable.' }
          if ((Get-FileHash "$unrelatedSkill/SKILL.md").Hash -ne $unrelatedHash) { throw 'An unrelated personal Skill was modified.' }
          if ((Get-FileHash "$learnedSkill/SKILL.md").Hash -ne $learnedHash) { throw 'Previously learned client knowledge was modified.' }
          foreach ($name in @('windows-desktop','windows-guide','wecom-desktop','cu-demo-orders')) {
            $skillPath = Join-Path $env:CLAUDE_CONFIG_DIR "skills/$name"
            if (-not (Test-Path "$skillPath/SKILL.md")) { throw "Missing personal Skill: $name" }
            $skillInstall = Get-Content "$skillPath/installation.json" -Raw -Encoding utf8 | ConvertFrom-Json
            if ($skillInstall.installDirectory -ne $receipt.installDirectory) { throw 'Personal Skill has the wrong installation path.' }
          }
          Move-Item -LiteralPath $bundle -Destination ($bundle + '-moved')
          $health = Join-Path $env:RUNNER_TEMP 'unrelated-working-directory'
          New-Item -ItemType Directory -Force $health | Out-Null
          Push-Location $health
          try {
            $output = (& claude mcp get windows_cu 2>&1 | Out-String)
            $output | Tee-Object "$env:GITHUB_WORKSPACE/artifacts/acceptance/claude-connection.log"
            $connected = $LASTEXITCODE -eq 0 -and $output -match 'Connected' -and $output -notmatch 'Failed to connect|Pending approval'
            @{ version = $version; connected = $connected; modelTaskVerified = $false; scope = 'user installation; original extraction moved; unrelated working directory'; reinstallVerified = $true; personalSkillsInstalled = $true; unrelatedSkillPreserved = $true; installDirectory = $receipt.installDirectory } | ConvertTo-Json | Set-Content "$env:GITHUB_WORKSPACE/artifacts/acceptance/claude-connection.json" -Encoding utf8
            if (-not $connected) { throw 'Installed MCP did not connect from another working directory.' }
          } finally { Pop-Location }

      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-${{ github.sha }}
          path: |
            artifacts/acceptance/
            artifacts/windows-bundle-run.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload portable Windows test bundle
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: windows-cu-win-x64-${{ github.sha }}
          path: artifacts/windows-cu-win-x64.zip
          retention-days: 30
          compression-level: 0
