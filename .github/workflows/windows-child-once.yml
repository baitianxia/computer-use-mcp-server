name: Windows child-session validation
on:
  push:
    branches: ['codex/windows-child-ci-20261126-01']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      WINDOWS_CU_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Record Windows runner and RDP services
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $os = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $sys = @{
            startUtc = [datetime]::UtcNow.ToString('o')
            commit = $env:GITHUB_SHA
            build = "$($os.CurrentBuild).$($os.UBR)"
            edition = $os.EditionID
            image = $env:ImageVersion
            sessionId = (Get-Process -Id $PID).SessionId
            interactive = [Environment]::UserInteractive
            ordinaryRdpDisabled = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server').fDenyTSConnections
            ordinaryRdpPortListening = [bool](Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue)
            services = @(Get-Service TermService,SessionEnv | Select-Object Name,@{n='status';e={$_.Status.ToString()}})
          }
          $sys | ConvertTo-Json -Depth 4 | Tee-Object -FilePath evidence/runner.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build the branch and run portable checks
        run: |
          & ./scripts/Build.ps1 -Runtime win-x64 *>&1 | Tee-Object evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build or portable checks failed.' }
      - name: Verify files in the exact Windows test ZIP
        id: bundle
        run: |
          $archive = Get-Item artifacts/windows-cu-win-x64.zip
          $bundle = Join-Path $env:RUNNER_TEMP 'Computer Use 测试包'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $bundle
          $sha = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($archive.Name)" | Set-Content -LiteralPath evidence/archive.sha256 -Encoding ascii
          $manifest = Get-Content -LiteralPath (Join-Path $bundle 'package-manifest.json') -Raw -Encoding utf8 | ConvertFrom-Json
          if ($manifest.sourceCommit -ne $env:GITHUB_SHA) { throw 'Unexpected package source.' }
          foreach ($item in $manifest.files) {
            $p = Get-Item -LiteralPath (Join-Path $bundle $item.path)
            if ($p.Length -ne $item.bytes -or (Get-FileHash -LiteralPath $p.FullName).Hash -ne $item.sha256) { throw "Manifest mismatch: $($item.path)" }
          }
          $hostSha = (Get-FileHash -LiteralPath (Join-Path $bundle 'scripts/ChildSessionHost.ps1')).Hash
          if ($hostSha -ne (Get-FileHash -LiteralPath 'scripts/ChildSessionHost.ps1').Hash) { throw 'Packaged RDP host differs from this commit.' }
          "Validated $($manifest.files.Count) package files, archive SHA-256 $sha, RDP host SHA-256 $hostSha"
      - name: Run Windows PowerShell lookup and simulated control regressions
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'Computer Use 测试包'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/Test-ChildSessionLookup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Child lookup regression failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/Test-RdpCredentialObservation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'RDP credential prompt regression failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/Test-RdpChildOperations.ps1 -BundleRoot $bundle
          if ($LASTEXITCODE -ne 0) { throw 'RDP operation regression failed.' }
      - name: Configure a real Windows RDP control
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'Computer Use 测试包'
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File ./tests/Test-RdpChildConfiguration.ps1 -BundleRoot $bundle 2>&1 | Tee-Object evidence/rdp-configuration.log
          if ($LASTEXITCODE -ne 0) { throw 'Real ActiveX configuration failed.' }
      - name: Check the existing parent session after enabling child sessions
        id: existing_parent
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && !contains(github.event.head_commit.message, '[fresh-parent]') }}
        timeout-minutes: 4
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'Computer Use 测试包'
          $report = Join-Path $pwd 'evidence/rdp-child-connection.json'
          & ./tests/Invoke-RdpChildConnectionCheck.ps1 -BundleRoot $bundle -ReportPath $report -EnableOnHostedRunner -TimeoutSeconds 45 -ProcessTimeoutSeconds 70
          $rc = $LASTEXITCODE
          Get-Content -LiteralPath 'evidence/rdp-child-connection.supervisor.json' -Raw -Encoding utf8
          $data = Get-Content -LiteralPath $report -Raw -Encoding utf8
          $data
          $r = $data | ConvertFrom-Json
          if ($r.hostScriptSha256 -ne (Get-FileHash -LiteralPath (Join-Path $bundle 'scripts/ChildSessionHost.ps1')).Hash) { throw 'Unexpected RDP host hash.' }
          if ($rc -eq 0 -and $r.status -eq 'passed' -and $r.rdpWtsBindingVerified -and $r.previewClosed) {
            'connected=true' >> $env:GITHUB_OUTPUT
          } else {
            $diagnosis = Get-Content -LiteralPath 'evidence/rdp-child-connection.supervisor.json' -Raw | ConvertFrom-Json
            if ($rc -ne 2 -or $diagnosis.status -ne 'blocked' -or $diagnosis.reason -ne 'interactive_credentials_required') {
              throw "Original parent check exited with $rc at $($r.stage): $($r.detail)"
            }
            Write-Host 'The original parent requires interactive credentials. The connection gate remains open.'
          }
          exit 0
      - name: Verify the connection from a parent logged in after enablement
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.existing_parent.outputs.connected != 'true' }}
        timeout-minutes: 5
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'Computer Use 测试包'
          $report = Join-Path $pwd 'evidence/fresh-parent.json'
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File ./tests/Invoke-FreshParentRdpCheck.ps1 -BundleRoot $bundle -ReportPath $report -TimeoutSeconds 75
          $rc = $LASTEXITCODE
          $r = Get-Content -LiteralPath $report -Raw -Encoding utf8 | ConvertFrom-Json
          if ($rc -ne 0 -or $r.status -ne 'passed') { throw "Fresh-parent check exited with $rc at $($r.stage): $($r.detail)" }
      - name: Collect RDP events from this run
        if: always()
        run: |
          $start = (Get-Item 'evidence/runner.json').CreationTime.AddSeconds(-5)
          $channels = @('Microsoft-Windows-TerminalServices-RDPClient/Operational','Microsoft-Windows-TerminalServices-LocalSessionManager/Operational','Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational')
          $records = @(foreach ($ch in $channels) {
            Get-WinEvent -FilterHashtable @{LogName=$ch; StartTime=$start} -MaxEvents 60 -ErrorAction SilentlyContinue |
              Select-Object TimeCreated,LogName,Id,LevelDisplayName
          })
          ConvertTo-Json -InputObject $records -Depth 3 | Set-Content -LiteralPath evidence/rdp-events.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-child-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
